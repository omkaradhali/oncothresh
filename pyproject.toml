[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oncothresh"
version = "0.1.0"
description = "Clinical threshold evaluation for oncology AI models"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Omkar Adhali", email = "omkar.a2989@gmail.com" }]
requires-python = ">=3.12"
keywords = ["oncology", "pathology", "AI", "evaluation", "clinical threshold"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/omkaradhali/oncothresh"
Repository = "https://github.com/omkaradhali/oncothresh"

[tool.hatch.build.targets.wheel]
packages = ["src/oncothresh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
